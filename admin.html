<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rəy paneli — AİSA</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  :root{--blue:#1a5fa8;--blue-light:#2876cc;--blue-pale:#e8f1fb;--blue-mid:#c2d9f5;--white:#ffffff;--gray:#f4f7fb;--text:#1a2535;--text-muted:#6b7a90;--radius:16px;--shadow:0 4px 24px rgba(26,95,168,0.10);--danger:#c0392b;--danger-pale:#fdecea;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--gray);color:var(--text);min-height:100vh;}
  .wrap{max-width:980px;margin:0 auto;padding:28px 18px 60px;}
  h1{font-family:'Nunito',sans-serif;font-weight:800;color:var(--blue);font-size:1.4rem;margin:0 0 4px;}
  .sub{color:var(--text-muted);font-size:0.9rem;margin-bottom:24px;}

  /* Login */
  #login-box{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px;max-width:380px;margin:60px auto;text-align:center;}
  #login-box .lock{font-size:2rem;margin-bottom:8px;}
  #login-box input{width:100%;border:1.5px solid var(--blue-mid);border-radius:10px;padding:11px 14px;font-size:0.95rem;font-family:'Inter',sans-serif;margin:14px 0;box-sizing:border-box;}
  #login-box button{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:11px 20px;font-family:'Nunito',sans-serif;font-weight:700;font-size:0.92rem;cursor:pointer;width:100%;}
  #login-box button:hover{background:var(--blue-light);}
  #login-error{color:var(--danger);font-size:0.85rem;min-height:18px;margin-top:4px;}

  /* Panel */
  #panel{display:none;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px;flex-wrap:wrap;}
  .count-badge{background:var(--blue-pale);color:var(--blue);font-family:'Nunito',sans-serif;font-weight:700;font-size:0.82rem;padding:6px 12px;border-radius:999px;}
  .btn{border:none;border-radius:10px;padding:9px 16px;font-family:'Nunito',sans-serif;font-weight:700;font-size:0.85rem;cursor:pointer;transition:background 0.15s;}
  .btn-ghost{background:var(--blue-pale);color:var(--blue);}
  .btn-ghost:hover{background:var(--blue-mid);}
  .btn-danger{background:var(--danger-pale);color:var(--danger);}
  .btn-danger:hover{background:#f8d7d3;}

  .fb-table{width:100%;border-collapse:collapse;background:var(--white);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);}
  .fb-table th{background:var(--blue-pale);color:var(--blue);font-family:'Nunito',sans-serif;font-weight:700;font-size:0.78rem;text-align:left;padding:10px 12px;white-space:nowrap;}
  .fb-table td{padding:10px 12px;font-size:0.86rem;border-top:1px solid var(--gray);vertical-align:top;}
  .fb-table td.msg-cell{white-space:pre-wrap;word-break:break-word;max-width:340px;}
  .fb-table td.date-cell{color:var(--text-muted);font-size:0.78rem;white-space:nowrap;}
  .fb-table td.name-cell{font-weight:600;white-space:nowrap;}
  .fb-table tr:hover td{background:var(--gray);}
  .fb-table .del-btn{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1rem;padding:4px 7px;border-radius:6px;line-height:1;}
  .fb-table .del-btn:hover{background:var(--danger-pale);color:var(--danger);}

  #empty-state{text-align:center;color:var(--text-muted);padding:60px 20px;font-size:0.95rem;}
  #empty-state .big{font-size:2.2rem;margin-bottom:10px;}
  #loading{text-align:center;color:var(--text-muted);padding:40px;font-size:0.9rem;}
</style>
</head>
<body>
<div class="wrap">
  <h1>💬 Rəy paneli</h1>
  <div class="sub">AİSA — istifadəçilərdən gələn rəylər</div>

  <div id="login-box">
    <div class="lock">🔒</div>
    <div style="font-weight:700;font-family:'Nunito',sans-serif;color:var(--blue);">Admin açarını daxil edin</div>
    <input id="key-input" type="password" placeholder="Admin açarı" onkeydown="if(event.key==='Enter')doLogin()"/>
    <button onclick="doLogin()">Daxil ol</button>
    <div id="login-error"></div>
  </div>

  <div id="panel">
    <div class="toolbar">
      <span class="count-badge" id="count-badge">0 rəy</span>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-ghost" onclick="loadFeedback()">↻ Yenilə</button>
        <button class="btn btn-danger" onclick="clearAll()">Hamısını sil</button>
      </div>
    </div>
    <div id="loading" style="display:none;">Yüklənir...</div>
    <div style="overflow-x:auto;">
      <table class="fb-table" id="fb-table" style="display:none;">
        <thead>
          <tr>
            <th>Ad Soyad</th>
            <th>Mesaj</th>
            <th>Tarix</th>
            <th>Səhifə</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="list"></tbody>
      </table>
    </div>
    <div id="empty-state" style="display:none;">
      <div class="big">📭</div>
      Hələ heç bir rəy yoxdur.
    </div>
  </div>
</div>

<script>
  var ADMIN_KEY = '';
  var lastMaxId = 0;
  var pollTimer = null;

  function playBeep(){
    try{
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var playTone = function(freq, startTime, dur){
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, startTime);
        gain.gain.exponentialRampToValueAtTime(0.18, startTime+0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime+dur);
        osc.connect(gain).connect(ctx.destination);
        osc.start(startTime);
        osc.stop(startTime+dur);
      };
      var now = ctx.currentTime;
      playTone(880, now, 0.15);
      playTone(1175, now+0.16, 0.18);
    }catch(e){ /* səs dəstəklənmirsə səssizcə keç */ }
  }

  function doLogin(){
    var k = document.getElementById('key-input').value.trim();
    if(!k){ document.getElementById('login-error').textContent = 'Açarı daxil edin.'; return; }
    ADMIN_KEY = k;
    loadFeedback(true);
  }

  function fmtDate(iso){
    var d = new Date(iso);
    var p = function(n){ return String(n).padStart(2,'0'); };
    return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes());
  }

  function loadFeedback(isFirstLoad){
    document.getElementById('loading').style.display = 'block';
    document.getElementById('list').innerHTML = '';
    document.getElementById('empty-state').style.display = 'none';
    fetch('/api/feedback?key='+encodeURIComponent(ADMIN_KEY))
      .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, d:d}; }); })
      .then(function(res){
        document.getElementById('loading').style.display = 'none';
        if(!res.ok){
          if(isFirstLoad){
            document.getElementById('login-error').textContent = res.d.error || 'Açar yanlışdır.';
          } else {
            alert(res.d.error || 'Xəta baş verdi.');
          }
          return;
        }
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('panel').style.display = 'block';
        renderList(res.d);
        updateLastMaxId(res.d);
        if(isFirstLoad){ startPolling(); }
      })
      .catch(function(){
        document.getElementById('loading').style.display = 'none';
        if(isFirstLoad){ document.getElementById('login-error').textContent = 'Şəbəkə xətası.'; }
        else { alert('Şəbəkə xətası.'); }
      });
  }

  function updateLastMaxId(items){
    lastMaxId = items.reduce(function(max,it){ return Math.max(max, it.id); }, lastMaxId);
  }

  // Panel açıq qalanda arxa planda, xəbərdarlıqsız/spinnersiz yoxlayır — təzə rəy gələndə səs çıxarır
  function startPolling(){
    if(pollTimer) return;
    pollTimer = setInterval(function(){
      if(!ADMIN_KEY) return;
      fetch('/api/feedback?key='+encodeURIComponent(ADMIN_KEY))
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(items){
          if(!items) return;
          var newMax = items.reduce(function(max,it){ return Math.max(max, it.id); }, 0);
          if(newMax > lastMaxId){
            playBeep();
            renderList(items);
          }
          lastMaxId = Math.max(lastMaxId, newMax);
        })
        .catch(function(){});
    }, 15000);
  }

  function renderList(items){
    document.getElementById('count-badge').textContent = items.length+' rəy';
    var listEl = document.getElementById('list');
    var tableEl = document.getElementById('fb-table');
    if(items.length===0){
      tableEl.style.display = 'none';
      document.getElementById('empty-state').style.display = 'block';
      return;
    }
    tableEl.style.display = 'table';
    document.getElementById('empty-state').style.display = 'none';
    listEl.innerHTML = items.map(function(it){
      return '<tr>'+
        '<td class="name-cell">'+(it.contact ? escapeHtml(it.contact) : '—')+'</td>'+
        '<td class="msg-cell">'+escapeHtml(it.message)+'</td>'+
        '<td class="date-cell">'+fmtDate(it.created_at)+'</td>'+
        '<td class="date-cell">'+(it.page ? escapeHtml(it.page) : '—')+'</td>'+
        '<td><button class="del-btn" onclick="delOne('+it.id+')" title="Sil">🗑</button></td>'+
      '</tr>';
    }).join('');
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function delOne(id){
    if(!confirm('Bu rəyi silmək istədiyinizə əminsiniz?')) return;
    fetch('/api/feedback/'+id+'?key='+encodeURIComponent(ADMIN_KEY), { method: 'DELETE' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d.ok){ loadFeedback(); }
        else { alert(d.error || 'Silinə bilmədi.'); }
      })
      .catch(function(){ alert('Şəbəkə xətası.'); });
  }

  function clearAll(){
    if(!confirm('BÜTÜN rəyləri silmək istədiyinizə əminsiniz? Bu geri qaytarıla bilməz.')) return;
    fetch('/api/feedback?key='+encodeURIComponent(ADMIN_KEY)+'&all=1', { method: 'DELETE' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d.ok){ loadFeedback(); }
        else { alert(d.error || 'Silinə bilmədi.'); }
      })
      .catch(function(){ alert('Şəbəkə xətası.'); });
  }
</script>
</body>
</html>
