services:
  - type: web
    name: refiq
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 3000
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: refiq-feedback-db
          property: connectionString
      - key: ADMIN_KEY
        sync: false

databases:
  - name: refiq-feedback-db
    plan: free
